name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_smoke:
        description: Run the isolated Linear and Codex smoke profile
        required: true
        default: false
        type: boolean
      linear_project_slug:
        description: Dedicated disposable Linear project slug (never a production project)
        required: false
        type: string

permissions:
  contents: read

jobs:
  format:
    name: scripts/check format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/check format

  vet:
    name: scripts/check vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/check vet

  lint:
    name: scripts/check lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/check lint

  test:
    name: scripts/check test
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/check test

  race:
    name: scripts/check race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/check race

  coverage:
    name: scripts/check coverage
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/check coverage

  tidy:
    name: scripts/check tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/check tidy

  live-smoke:
    name: isolated live smoke
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_live_smoke &&
      inputs.linear_project_slug != ''
    runs-on: ubuntu-latest
    environment: live-smoke
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      LINEAR_SMOKE_PROJECT_SLUG: ${{ inputs.linear_project_slug }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Prepare isolated workflow
        run: |
          cp WORKFLOW.smoke.example.md "$RUNNER_TEMP/symphony-smoke-workflow.md"
          sed -i "s|__LINEAR_SMOKE_PROJECT_SLUG__|$LINEAR_SMOKE_PROJECT_SLUG|" "$RUNNER_TEMP/symphony-smoke-workflow.md"
      - name: Validate live profile without side effects
        run: go run ./cmd/symphony --dry-run "$RUNNER_TEMP/symphony-smoke-workflow.md"
